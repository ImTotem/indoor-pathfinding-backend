services:
  db:
    build:
      context: ./docker
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_USER: indoor
      POSTGRES_PASSWORD: indoor
      POSTGRES_DB: indoor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indoor"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://indoor:indoor@db:5432/indoor
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: indoor
      POSTGRES_USER: indoor
      POSTGRES_PASSWORD: indoor
      STORAGE_ROOT: /app/var/storage
      DATA_DIR: /app/be/data
      INDOOR_VPS_LOCALIZER_MODE: slam_v3
      PYTHONPATH: /app/src:/app/be:/app
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8080:8000"
    volumes:
      - ./var:/app/var
      # Dev: 소스 bind mount → 코드 수정 시 재빌드 불필요 (restart 만)
      - ./src:/app/src
      - ./be:/app/be
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head && uv run uvicorn indoor_server.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://indoor:indoor@db:5432/indoor
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: indoor
      POSTGRES_USER: indoor
      POSTGRES_PASSWORD: indoor
      STORAGE_ROOT: /app/var/storage
      DATA_DIR: /app/be/data
      PYTHONPATH: /app/src:/app/be:/app
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./var:/app/var
      # Dev: 소스 bind mount → 코드 수정 시 restart 만 (재빌드 불필요)
      - ./src:/app/src
      - ./be:/app/be
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "indoor_server.worker"]
    stop_grace_period: 600s

volumes:
  pgdata:
